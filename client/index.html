<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="Start()">
    <div class="sidenav" id="sidenav">
        <h2>release v1.0.0</h2>
        <a href="index.html" style="color: white;">
            <h1>Tic-Tac-Toe</h1>
            <button>Home</button>
        </a>
        <br>
        <h3>Play</h3>
        <div>
            <button onclick="CreateGame()">Create Game</button>
            <label>Invite Code</label>
            <input id="gamecode" type="password" placeholder="Enter Code (max 6)" maxlength="6">
            <button onclick="JoinGame()">Join Game</button>
            <button onclick="CopyInviteLink()">Copy Invite Link</button>
            <button onclick="CopyInviteCode()">Copy Invite Code</button>
            <button onclick="LeaveGame()">Leave Game</button>
        </div>

        <h3>Account</h3>
        <div>
            <div>
                <label>Username</label>
                <input required name="username" id="username" placeholder="Enter name..." minlength="3" maxlength="16"
                    value="COOKIE" type="text">
                <label>Avatar</label>
                <select required name="pfp" id="pfp">
                </select>
            </div>

            <button onclick="Save(true)">Save</button>
        </div>
        <h3>About</h3>
        <div>
            <p>it's tic-tac-toe</p>

        </div>
    </div>
    <div class="game" id="game">
        <div>
            <label id="op-u">opponent</label>
                <img width="64" height="64" id="op-pfp" src="assets/ui/profiles/MKDSEmblemTeamBlue.png">
        </div>
        <div class="board" id="board">
            <button class="square" onclick="place(0)"></button>
            <button class="square" onclick="place(1)"></button>
            <button class="square" onclick="place(2)"></button>
            <button class="square" onclick="place(3)"></button>
            <button class="square" onclick="place(4)"></button>
            <button class="square" onclick="place(5)"></button>
            <button class="square" onclick="place(6)"></button>
            <button class="square" onclick="place(7)"></button>
            <button class="square" onclick="place(8)"></button>
        </div>

        <div>
            <label id="me">player</label>
            <img width="64" height="64" id="mepfp" src="assets/ui/profiles/MKDSEmblemTeamRed.png">
        </div>
    </div>
    <center>
        <noscript>no JavaScript, no game... Please activate JavaScript in your browser.</noscript>
    </center>
</body>

<script src="dataTypes.js"></script>
<script src="network.js"></script>
<script src="script.js"></script>
<script src="game.js"></script>

</html>
